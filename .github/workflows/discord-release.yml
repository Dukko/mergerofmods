name: Announce release on Discord

# When a release is published, post it to the #collection-news webhook.
# Can also be run manually from the Actions tab to announce a specific tag.
# The webhook URL lives in the DISCORD_WEBHOOK_URL repository secret
# (Settings > Secrets and variables > Actions). Nothing secret is in this file.
# Release posts ping the New Collection Content role (<@&847863328985448538>).

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to announce"
        required: true

permissions:
  contents: read

jobs:
  announce:
    if: github.event_name == 'workflow_dispatch' || github.event.release.prerelease == false
    runs-on: ubuntu-24.04
    steps:
      - name: Post release to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "::warning::DISCORD_WEBHOOK_URL secret is not set; skipping Discord post"
            exit 0
          fi
          release=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$REPO/releases/tags/$TAG")
          payload=$(echo "$release" | jq --arg mention "<@&847863328985448538>" '(if .name and .name != "" then .name + " (" + .tag_name + ")" else .tag_name end) as $title | {content: ($mention + " New release: " + $title), embeds: [{title: $title, url: .html_url, description: ((.body // "") | .[0:2000]), color: 5814783}]}')
          curl -fsS -H "Content-Type: application/json" -d "$payload" "$DISCORD_WEBHOOK_URL"
